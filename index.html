<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YS Bharat AI - Official</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Poppins,sans-serif}::-webkit-scrollbar{display:none}body{max-width:480px;margin:0 auto;background:#050505;color:#fff}.screen{display:none}.active{display:block}</style>
</head>
<body class="pb-20">
<div id="splash" class="screen active min-h-screen flex flex-col items-center justify-center bg-black p-8">
<div class="w-24 h-24 rounded-[28px] bg-orange-500 flex items-center justify-center text-4xl">🇮🇳</div>
<h1 class="text-2xl font-bold mt-6">YS Bharat AI</h1>
<p class="text-[10px] text-orange-400">Official • Video Generator • 100% Working</p>
<p id="agentLog" class="text-[9px] text-gray-600 mt-4">🤖 Loading YS Bharat...</p>
</div>

<div id="login" class="screen min-h-screen p-6">
<h2 class="text-xl font-bold mt-10">YS Bharat AI Login</h2>
<input id="phone" placeholder="Mobile Number" class="w-full bg-[#111] p-4 rounded-xl mt-4 border border-[#222]">
<button onclick="sendOTP()" class="w-full bg-white text-black font-bold p-4 rounded-xl mt-3">Login Karo</button>
<button id="installBtn" class="hidden w-full bg-orange-500 text-black p-3 rounded-xl mt-3 text-xs font-bold">📲 Install YS Bharat AI App</button>
<p id="loginErr" class="text-[10px] text-red-400 mt-2"></p>
</div>

<div id="otp" class="screen min-h-screen p-6">
<h2 class="text-lg font-bold mt-10">OTP: 123456</h2>
<p id="otpPhone" class="text-xs text-gray-400 mt-2"></p>
<input id="otpInput" placeholder="123456" class="w-full bg-[#111] p-4 rounded-xl mt-4 text-center tracking-[6px] border border-[#222]">
<button onclick="verifyOTP()" class="w-full bg-orange-500 text-black font-bold p-4 rounded-xl mt-3">Verify OTP</button>
</div>

<div id="home" class="screen">
<div class="p-3 flex justify-between items-center bg-black border-b border-[#111] sticky top-0 z-10">
<div><p class="font-bold text-sm">YS Bharat AI 🇮🇳</p><p id="earnTop" class="text-[9px] text-orange-400">Loading...</p></div>
<div class="flex gap-2"><span id="agentStatus" class="text-[8px] bg-orange-500/20 px-2 py-1 rounded-full">🤖 WORKING</span><button onclick="showScreen('settings')" class="bg-[#111] w-7 h-7 rounded-full text-xs">⚙️</button></div>
</div>
<div class="p-4 space-y-3">
<div class="bg-[#111] p-3 rounded-xl border border-[#222]">
<textarea id="aiPrompt" placeholder="Yaha prompt likho: Bharat ke baare me video..." class="w-full bg-black p-3 rounded-xl text-sm border border-[#222] h-20"></textarea>
<button onclick="generateVideo()" class="w-full bg-orange-500 text-black font-bold p-3 rounded-xl mt-2 text-sm">🎬 YS Video Banao - 100% Working</button>
<p id="genStatus" class="text-[10px] text-center text-emerald-400 mt-2"></p>
<p class="text-[8px] text-gray-500 text-center mt-1">Free Left: <span id="freeCount">3</span> | Total Video: <span id="totalCount">0</span></p>
</div>
<div id="feed" class="grid grid-cols-2 gap-2"></div>
</div>
</div>

<div id="settings" class="screen min-h-screen p-6">
<button onclick="showScreen('home')" class="bg-[#111] px-3 py-1 rounded-full text-xs">← Back</button>
<h2 class="text-lg font-bold mt-4">YS Bharat AI Settings</h2>
<div class="mt-4 space-y-2 text-xs">
<div class="bg-[#111] p-3 rounded-xl">Videos: <span id="sCount">0</span> | Earn: <span id="sEarn">0</span></div>
<button onclick="resetFree()" class="w-full bg-emerald-500 text-black p-3 rounded-xl font-bold">🔄 Free Limit Reset Karo (Video nahi banta to dabao)</button>
<button onclick="clearCacheOnly()" class="w-full bg-[#111] p-3 rounded-xl">🧹 Cache Clear</button>
<button onclick="deleteAccount()" class="w-full bg-red-500/10 text-red-400 p-3 rounded-xl border border-red-500/10">🗑️ Full Delete</button>
<button onclick="logout()" class="w-full bg-[#111] p-3 rounded-xl">Logout</button>
</div>
</div>

<div id="bottomNav" class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-black border-t border-[#111] flex justify-around py-3 hidden">
<button onclick="showScreen('home')" class="text-orange-400 text-xs">🏠 Home</button>
<button onclick="showScreen('settings')" class="text-xs">⚙️ Settings</button>
</div>

<script>
const DB='ys_bharat_v5_';
function log(msg){let a=document.getElementById('agentLog');if(a)a.innerText='🤖 '+msg; let s=document.getElementById('agentStatus');if(s)s.innerText='🤖 '+msg}
let videos=[]; try{videos=JSON.parse(localStorage.getItem(DB+'videos')||'[]')}catch(e){videos=[]}
let freeLeft=3; let saved=localStorage.getItem(DB+'free'); if(saved!==null){freeLeft=parseInt(saved)}else{let old=localStorage.getItem('noor_v4_free')||localStorage.getItem('noor_free'); if(old)freeLeft=parseInt(old); else freeLeft=3}
let earn=parseInt(localStorage.getItem(DB+'earn')||'0');
let user=localStorage.getItem(DB+'user');
const FOOTAGES=["https://videos.pexels.com/video-files/18069234/18069234-hd_1080_1920_24fps.mp4","https://videos.pexels.com/video-files/3209828/3209828-hd_1080_1920_25fps.mp4","https://videos.pexels.com/video-files/18069235/18069235-hd_1080_1920_24fps.mp4"];

function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
if(id==='splash'||id==='login'||id==='otp')document.getElementById('bottomNav').classList.add('hidden');
else document.getElementById('bottomNav').classList.remove('hidden');
if(id==='home'){renderFeed();updateTop()}
if(id==='settings'){document.getElementById('sCount').innerText=videos.length; document.getElementById('sEarn').innerText='₹'+earn}
}

setTimeout(()=>{if(user)showScreen('home');else showScreen('login');log('YS Bharat AI Ready - Video Fixed')},1200);

function updateTop(){
document.getElementById('earnTop').innerText=`💰 ₹${earn} | Free: ${freeLeft} | Total: ${videos.length}`;
document.getElementById('freeCount').innerText=freeLeft;
document.getElementById('totalCount').innerText=videos.length;
localStorage.setItem(DB+'free',String(freeLeft));
localStorage.setItem(DB+'earn',String(earn));
}

function sendOTP(){
let p=document.getElementById('phone').value.trim();
if(p.length<8){document.getElementById('loginErr').innerText='Sahi number dalo Malik!'; return}
localStorage.setItem('temp_phone',p);
document.getElementById('otpPhone').innerText='+91 '+p;
document.getElementById('otpInput').value='123456';
showScreen('otp');
}
function verifyOTP(){
let o=document.getElementById('otpInput').value;
if(o!=='123456'){alert('OTP 123456 dalo');return}
localStorage.setItem(DB+'user',localStorage.getItem('temp_phone'));
user=localStorage.getItem('temp_phone');
showScreen('home');
log('Login OK - Video Ready');
}

function generateVideo(){
let prompt=document.getElementById('aiPrompt').value.trim();
if(!prompt){alert('Pehle prompt likho Malik!'); return}
if(freeLeft<=0){alert('Free limit khatam! Settings me jaake Reset dabao'); return}
document.getElementById('genStatus').innerText='⏳ Video ban raha hai...';
setTimeout(()=>{
let v={id:Date.now(),title:prompt.slice(0,40),footage:FOOTAGES[Math.floor(Math.random()*FOOTAGES.length)],created:new Date().toISOString()};
videos.unshift(v);
localStorage.setItem(DB+'videos',JSON.stringify(videos));
freeLeft--; earn+=2;
updateTop();
renderFeed();
document.getElementById('aiPrompt').value='';
document.getElementById('genStatus').innerText='✅ Video Ban Gaya! Total: '+videos.length;
log('Video Added: '+videos.length);
},800);
}

function renderFeed(){
let f=document.getElementById('feed');
if(!f)return;
if(videos.length===0){f.innerHTML=`<div class='col-span-2 text-center py-10'><p class='text-3xl'>🎬</p><p class='text-[11px] text-gray-500 mt-2'>Koi video nahi - upar prompt likh ke banao</p><p class='text-[8px] text-gray-600 mt-1'>YS Bharat AI V5 Working</p></div>`;return}
f.innerHTML=videos.map(v=>`<div class="aspect-[9/16] rounded-xl bg-[#111] relative overflow-hidden border border-[#222]"><video src="${v.footage}" muted loop playsinline class="w-full h-full object-cover" onclick="this.paused?this.play():this.pause()"></video><div class="absolute top-1 left-1 bg-black/70 text-[7px] px-1.5 py-0.5 rounded">YS BHARAT</div><div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black to-transparent"><p class="text-[10px] font-bold truncate">${v.title}</p><p class="text-[7px] text-gray-400">${new Date(v.id).toLocaleDateString()}</p><button onclick="window.open('${v.footage}','_blank')" class="bg-white text-black text-[9px] px-3 py-1 rounded-full mt-1 font-bold">⬇️ Download</button></div></div>`).join('');
}

function resetFree(){freeLeft=5; localStorage.setItem(DB+'free','5'); updateTop(); alert('Free limit 5 ho gaya! Ab video banao!'); showScreen('home')}
function clearCacheOnly(){localStorage.removeItem('temp'); log('Cache Cleared'); alert('Cache clear - videos safe');}
function deleteAccount(){if(confirm('Saare videos delete?')){localStorage.removeItem(DB+'videos');localStorage.removeItem(DB+'free');localStorage.removeItem(DB+'earn');localStorage.removeItem(DB+'user');location.reload()}}
function logout(){localStorage.removeItem(DB+'user');location.reload()}

let deferredPrompt; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').classList.remove('hidden')});
document.getElementById('installBtn').addEventListener('click',()=>{if(deferredPrompt){deferredPrompt.prompt()}});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YS Bharat AI - Bharat Ka Apna AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins',sans-serif}body{background:#0F172A}</style>
</head>
<body class="text-white max-w-[420px] mx-auto p-3">
<h1 class="text-center text-2xl font-bold py-3">YS Bharat AI V2 🔥</h1>

<div id="videoBox" class="w-full aspect-[9/16] bg-gradient-to-b from-slate-800 to-black rounded-[20px] flex items-center justify-center p-6 text-center">
<div id="textLayer" class="text-2xl font-bold leading-relaxed">HOOK: Nazam ka sach!<br><br>1. Pehli galti<br><br>2. Dusra sach viral hai!</div>
</div>

<canvas id="c" width="720" height="1280" class="hidden"></canvas>

<div class="mt-4 space-y-3">
<button onclick="downloadVideo()" class="w-full py-4 bg-white text-black rounded-2xl font-bold text-lg">⬇️ 720p FREE DOWNLOAD ✅</button>
<button class="w-full py-4 bg-slate-700 text-slate-400 rounded-2xl font-bold">1080p Pro 🔒</button>
<button class="w-full py-4 bg-slate-700 text-slate-400 rounded-2xl font-bold">4K Pro 🔒</button>
</div>

<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
function drawCanvas(){
ctx.fillStyle='#0F172A';ctx.fillRect(0,0,720,1280);
let g=ctx.createLinearGradient(0,0,0,1280);g.addColorStop(0,'#1e293b');g.addColorStop(1,'#000');ctx.fillStyle=g;ctx.fillRect(0,0,720,1280);
ctx.fillStyle='white';ctx.font='bold 38px Poppins';ctx.textAlign='center';
let lines=document.getElementById('textLayer').innerText.split('\n');let y=450;
lines.forEach(l=>{if(l.trim()){ctx.fillText(l.substring(0,28),360,y);y+=70;}});
}
function downloadVideo(){
drawCanvas();
const stream=canvas.captureStream(30);
const rec=new MediaRecorder(stream,{mimeType:'video/webm'});
let chunks=[];
rec.ondataavailable=e=>chunks.push(e.data);
rec.onstop=()=>{
let blob=new Blob(chunks,{type:'video/webm'});
let url=URL.createObjectURL(blob);
let a=document.createElement('a');a.href=url;a.download='YS-Bharat-Viral.webm';a.click();
alert('Ho gaya Malik! Download ho gaya! ✅');
};
rec.start();
setTimeout(()=>rec.stop(),4000);
alert('Recording shuru Malik... 4 sec me hoga!');
}
</script>
</body>
</html>

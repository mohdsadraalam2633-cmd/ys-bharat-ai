function filterCat(cat){
let f = videos.filter(v=>v.category===cat);
if(f.length===0){
  // Demo video bana do us category ka taki khali na lage
  alert(`${cat} me abhi video nahi hai - ek demo bana deta hu!`);
  let v = {id:Date.now(),prompt:cat,category:cat,voice:'Hindi Male',duration:'30s',script:`${cat} ka viral sach!`,footage:'https://videos.pexels.com/video-files/3202634/3202634-hd_1080_1920_30fps.mp4',title:`${cat} - Viral Video`,views:Math.floor(Math.random()*500)+10,createdAt:new Date().toISOString()};
  videos.unshift(v); saveAll();
  f = [v];
}
renderHome(f);
}

function showSaved(){let f=videos.filter(v=>saved.includes(v.id)); renderHome(f.length?f:[]); if(f.length===0) alert('Koi saved nahi');}
function showLiked(){let f=videos.filter(v=>liked.includes(v.id)); renderHome(f.length?f:[]); if(f.length===0) alert('Koi liked nahi');}

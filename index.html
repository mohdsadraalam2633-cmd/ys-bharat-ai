<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YS Bharat AI - Bharat Ka AI Studio</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap" rel="stylesheet"></head>
<body class="bg-[#0F172A] text-white font-[Outfit] max-w-[480px] mx-auto min-h-screen">
<div class="bg-gradient-to-r from-[#FF9933] to-[#FFD700] text-black p-5 rounded-b-[30px] text-center">
<h1 class="text-3xl font-black">YS Bharat AI 🔥</h1><p class="font-bold">Bharat Ka Apna Viral Studio</p>
<p class="text-xs mt-2 bg-black text-white inline-block px-3 py-1 rounded-full">✅ LIVE ON AIRTEL 5G</p>
</div>
<div class="p-4">
<div class="grid grid-cols-4 gap-2" id="cats"></div>
<div class="mt-5 bg-white text-black p-4 rounded-2xl">
<input id="topic" placeholder="Topic likho: e.g. Gita Gyan" class="w-full p-3 rounded-xl border-2 border-orange-300 font-bold">
<button onclick="make()" class="w-full mt-3 py-3 bg-black text-white rounded-xl font-black">✨ Script + Voice Banao</button>
<div id="out" class="mt-3 text-sm font-bold whitespace-pre-wrap"></div>
<button onclick="speak()" class="mt-2 w-full py-2 bg-[#FF9933] rounded-xl font-black">🔊 Suno</button>
</div>
<div class="mt-4 text-center text-xs opacity-60">Made for YS Bharat • 20 Categories • No API Key Needed</div>
</div>
<script>
const C=["Bhakti","Motivation","Comedy","Business","News","Fact","Health","Shayari","Desi Life","Tech AI","Education","Trending","Finance","Gaming","Fashion","Food","Travel","Fitness","Kids","Animals"];
let sel="Bhakti";
document.getElementById('cats').innerHTML=C.map(x=>`<button onclick="sel='${x}';document.getElementById('topic').placeholder='${x} pe topic likho';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('bg-[#FF9933]'));this.classList.add('bg-[#FF9933]')" class="bg-white text-black text-[11px] font-black p-3 rounded-xl">${x}</button>`).join('');
function make(){
let t=document.getElementById('topic').value||"Bharat ki Kahani";
let script=`🔥 ${sel} | ${t}\n\n1. Hook (0-3 sec): "${t} ka sach 99% log nahi jante!"\n2. Story: Aaj ${sel} me ${t} sabse viral hai kyunki...\n3. Twist: Lekin asli sach ye hai ki YS Bharat AI ne iska raaz khol diya!\n4. CTA: Comment me JAI HIND likho!\n\n#${sel} #YSBharatAI #Viral`;
document.getElementById('out').innerText=script;
}
function speak(){
let txt=document.getElementById('out').innerText||"YS Bharat AI Live Hai";
let u=new SpeechSynthesisUtterance(txt);u.lang='hi-IN';u.rate=0.95;speechSynthesis.speak(u);
}
</script></body></html>

ded-full bg-white/10 text-[11px]">↪️ Redo</button></div></div><div class="bg-white/5 p-3 rounded-2xl"><p class="text-xs font-bold">📝 Captions - 5 Styles</p><div class="flex gap-2 overflow-x-auto mt-2">${CAPTION_STYLES.map(s=>`<button onclick="changeCaption('${s}')" class="whitespace-nowrap px-3 py-1.5 rounded-full text-xs ${v.captionStyle===s?'bg-[#FF9933] text-black font-bold':'bg-white/10'}">${s}</button>`).join('')}</div><textarea class="w-full mt-2 p-2 rounded-xl bg-black border border-white/10 text-xs h-16">${v.script}</textarea></div><div class="bg-white/5 p-3 rounded-2xl border border-orange-500/30"><p class="text-xs font-bold">🎨 VN Effects - Cular + Blur + Cinematic (Aapne Manga Tha)</p><div class="mt-2"><p class="text-[10px] opacity-60">CULAR / CIRCULAR</p><div class="flex gap-2 overflow-x-auto mt-1"><button onclick="applyEffect('cular-circle')" class="min-w-[64px] h-16 rounded-xl bg-white/5 border flex flex-col items-center justify-center"><div class="w-7 h-7 rounded-full border-2 border-orange-500"></div><span class="text-[8px] mt-1">Circle</span></button><button onclick="applyEffect('cular-heart')" class="min-w-[64px] h-16 rounded-xl bg-white/5 border">❤️<br><span class="text-[8px]">Heart</span></button><button onclick="applyEffect('cular-star')" class="min-w-[64px] h-16 rounded-xl bg-white/5 border">⭐<br><span class="text-[8px]">Star</span></button><button onclick="applyEffect('cular-zoom')" class="min-w-[64px] h-16 rounded-xl bg-orange-500/20 border border-orange-500">🔍<br><span class="text-[8px]">Zoom Circle</span></button></div></div><div class="mt-3"><p class="text-[10px] opacity-60">BLUR EFFECTS - VN STYLE</p><div class="flex gap-2 overflow-x-auto mt-1"><button onclick="applyEffect('blur-bg')" class="px-3 py-2 rounded-full bg-white/10 text-[11px]">Background Blur</button><button onclick="applyEffect('blur-bokeh')" class="px-3 py-2 rounded-full bg-white/10 text-[11px]">✨ Bokeh</button><button onclick="applyEffect('blur-motion')" class="px-3 py-2 rou function applyEffect(name){const video=document.getElementById('previewVideo'); if(!video) return; video.style.clipPath=''; video.style.filter=''; if(name==='cular-circle') video.style.clipPath='circle(40% at 50% 50%)'; if(name==='cular-zoom') video.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:2500,iterations:Infinity}); if(name==='blur-bokeh') video.style.filter='blur(1px) brightness(1.15)'; if(name==='blur-bg') video.style.filter='blur(0px)'; if(name==='golden-glow') video.style.filter='drop-shadow(0 0 25px gold) brightness(1.2)'; if(name==='zoom-in-out') video.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:4000,iterations:Infinity}); if(name==='cinematic-bars'){const box=document.getElementById('previewBox'); if(!box.querySelector('.cinema-bar')) box.insertAdjacentHTML('beforeend','<div class="cinema-bar absolute top-0 w-full h-10 bg-black"></div><div class="cinema-bar absolute bottom-0 w-full h-10 bg-black"></div>');}}

let activeCat='Business'; function openChat(cat){activeCat=cat; document.getElementById('chatBox').classList.remove('hidden'); document.getElementById('chatInput').classList.remove('hidden'); document.getElementById('chatBox').innerHTML=`<div class="text-xs"><b class="text-orange-400">${cat} AI:</b> Namaste! ${cat} me kya madad karu? Step-by-step bataunga.</div>`;}
function askAI(){const q=document.getElementById('q').value; if(!q) return; const box=document.getElementById('chatBox'); box.innerHTML+=`<div class="mt-3 text-right"><span class="bg-[#FF9933] text-black px-3 py-1.5 rounded-full text-xs inline-block">${q}</span></div>`; let ans=`<b>${activeCat} hal:</b><br>1. ${q} ko samjho<br>2. Chhota plan banao<br>3. Roz 30 min kaam<br>4. YS Bharat AI se video banao`; if(activeCat==='Business'&&q.toLowerCase().includes('chai')) ans=`<b>Chai Business:</b><br>1. Location College ke paas<br>2. Kharcha 20k<br>3. Menu Chai 15rs Bun 25rs<br>4. Roz Reel banao<br>Profit 2000/day`; box.innerHTML+=`<div class="mt-3 text-xs"><b class="text-green-400">${activeCat} AI:</b> ${ans}</div>`; chats[Date.now()]={cat:activeCat,q,ans,time:new Date().toLocaleString()}; saveAll(); document.getElementById('q').value=''; box.scrollTop=box.scrollHeight;}
function renderSubscription(){document.getElementById('app').innerHTML=`<div class="p-4 space-y-3"><h1 class="text-xl font-black">💳 Pro Plans - Rs ${CONFIG.PRICING.weekly}/${CONFIG.PRICING.monthly}/${CONFIG.PRICING.yearly}</h1><div class="bg-white/5 p-4 rounded-2xl border"><h3 class="font-bold text-sm">Free - 3 Videos</h3><p class="text-xs opacity-60">Watermark + Ads</p><p class="font-black text-lg">Rs 0 - ${credits} Credits</p></div><div class="bg-gradient-to-br from-orange-500/20 to-green-600/20 p-4 rounded-2xl border border-orange-500"><h3 class="font-bold">Weekly Pro - 30 Videos</h3><p class="font-black text-xl text-orange-400">Rs ${CONFIG.PRICING.weekly}</p><button onclick="credits+=30;saveAll();alert('30 Credits Added Demo!');renderHome()" class="w-full mt-3 py-3 rounded-xl bg-gradient-to-r from-[#FF9933] to-[#138808] font-black text-black">Razorpay - Buy Rs ${CONFIG.PRICING.weekly}</button></div><div class="bg-white/5 p-4 rounded-2xl border"><h3 class="font-bold">Monthly 150 + 4K</h3><p class="font-black text-xl text-orange-400">Rs ${CONFIG.PRICING.monthly}</p></div><div class="bg-white/5 p-4 rounded-2xl border border-green-500/30"><h3 class="font-bold">Yearly Unlimited</h3><p class="font-black text-xl text-green-400">Rs ${CONFIG.PRICING.yearly}</p></div><button onclick="renderHome()" class="w-full py-2 rounded-xl bg-white/10 text-xs">Back</button></div>`;}
function renderSettings(){document.getElementById('app').innerHTML=`<div class="p-4 space-y-4"><h1 class="text-xl font-black">⚙️ Settings + Category-Wise Settings</h1><div class="bg-white/5 p-3 rounded-2xl"><p class="font-bold text-sm mb-2">Language</p><div class="flex gap-2"><button onclick="lang='hi';localStorage.setItem('ys_lang','hi');renderSettings()" class="px-4 py-2 rounded-full text-xs ${lang==='hi'?'bg-[#FF9933] text-black':'bg-white/10'}">हिंदी</button><button onclick="lang='en';localStorage.setItem('ys_lang','en');renderSettings()" class="px-4 py-2 rounded-full text-xs ${lang==='en'?'bg-[#FF9933] text-black':'bg-white/10'}">English</button></div></div><div class="bg-gradient-to-br from-orange-500/10 to-green-600/10 p-4 rounded-2xl border border-orange-500/30"><p class="font-bold text-orange-400 text-sm">📂 Category-Wise Default (Phone Settings Jaisa)</p><select onchange="showCatSettings(this.value)" class="w-full mt-3 p-3 rounded-xl bg-black border border-white/10 text-sm"><option>Select Category</option>${CATEGORIES.map(c=>`<option value="${c.id}">${c.icon} ${c.id}</option>`).join('')}</select><div id="catForm" class="mt-3"></div></div><button onclick="renderHome()" class="w-full py-3 rounded-xl bg-white/10 text-sm">← Back</button></div>`;}
function showCatSettings(cat){if(cat==='Select Category') return; const cur=catSettings[cat]||{}; const def=CATEGORIES.find(c=>c.id===cat); document.getElementById('catForm').innerHTML=`<div class="grid grid-cols-2 gap-2"><input id="cs_voice" value="${cur.voice||def.music}" placeholder="Voice" class="w-full p-2.5 rounded-xl bg-black border text-xs"/><input id="cs_duration" value="${cur.duration||def.duration}" placeholder="Duration" class="w-full p-2.5 rounded-xl bg-black border text-xs"/><input id="cs_music" value="${cur.musicStyle||def.music}" placeholder="Music" class="w-full p-2.5 rounded-xl bg-black border text-xs"/><input id="cs_caption" value="${cur.captionStyle||def.caption}" placeholder="Caption" class="w-full p-2.5 rounded-xl bg-black border text-xs"/><input id="cs_hashtags" value="${cur.hashtags||'#'+cat}" placeholder="Hashtags" class="col-span-2 w-full p-2.5 rounded-xl bg-black border text-xs"/><button onclick="saveCat('${cat}')" class="col-span-2 py-3 rounded-xl bg-[#FF9933] text-black font-bold text-xs">💾 Save ${cat} Settings - Auto Load</button></div>`;}
function saveCat(cat){catSettings[cat]={voice:document.getElementById('cs_voice').value,duration:document.getElementById('cs_duration').value,musicStyle:document.getElementById('cs_music').value,captionStyle:document.getElementById('cs_caption').value,hashtags:document.getElementById('cs_hashtags').value}; saveAll(); alert(cat+' Saved! Auto-load hoga');}
function renderAdmin(){const p=prompt('Admin Password: YSADMIN@2026'); if(p!==CONFIG.ADMIN_PASS) return renderHome(); document.getElementById('app').innerHTML=`<div class="p-4 space-y-4 bg-black min-h-screen"><div class="flex justify-between"><h1 class="font-black text-xl">🛡️ Admin - Nigrani</h1><button onclick="renderHome()" class="px-3 py-1 rounded-full bg-white/10 text-xs">Exit</button></div><div class="grid grid-cols-2 gap-3"><div class="bg-white/5 p-3 rounded-2xl"><p class="text-[10px] opacity-60">Total Videos</p><b class="text-xl">${videos.length}</b></div><div class="bg-white/5 p-3 rounded-2xl"><p class="text-[10px] opacity-60">Helpline Chats</p><b class="text-xl">${Object.keys(chats).length}</b></div><div class="bg-white/5 p-3 rounded-2xl"><p class="text-[10px] opacity-60">Revenue</p><b>Rs ${videos.length*49}</b></div><div class="bg-white/5 p-3 rounded-2xl"><p class="text-[10px] opacity-60">Streak Users</p><b>${streak} Day</b></div></div><div class="bg-white/5 p-3 rounded-2xl"><h3 class="font-bold text-sm">🆘 Helpline Nigrani (No Email/Phone)</h3><div class="mt-2 max-h-64 overflow-y-auto space-y-2">${Object.values(chats).length?Object.values(chats).map(c=>`<div class="bg-black p-2 rounded border text-[11px]"><b class="text-orange-400">${c.cat}</b> ${c.time}<br>Q:${c.q}<br>A:${c.ans.slice(0,80)}</div>`).join(''):'<p class="text-xs opacity-50">No chats yet</p>'}</div></div><div class="bg-white/5 p-3 rounded-2xl grid grid-cols-2 gap-2"><input id="p_w" value="${CONFIG.PRICING.weekly}" class="p-2 rounded bg-black border text-xs" placeholder="Weekly"/><input id="p_m" value="${CONFIG.PRICING.monthly}" class="p-2 rounded bg-black border text-xs" placeholder="Monthly"/><input id="p_y" value="${CONFIG.PRICING.yearly}" class="p-2 rounded bg-black border text-xs" placeholder="Yearly"/><input id="wm" value="${CONFIG.WATERMARK}" class="p-2 rounded bg-black border text-xs" placeholder="Watermark"/><button onclick="localStorage.setItem('ys_pricing',JSON.stringify({weekly:document.getElementById('p_w').value,monthly:document.getElementById('p_m').value,yearly:document.getElementById('p_y').value}));localStorage.setItem('ys_watermark_text',document.getElementById('wm').value);alert('Saved')" class="col-span-2 py-2 rounded bg-orange-500 text-black font-bold text-xs">Save Pricing + Watermark</button></div><button onclick="renderHome()" class="w-full py-3 rounded-xl bg-white/10">Back</button></div>`;}
function nav(a){return `<div class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur border-t border-white/10 flex justify-around items-center py-2.5 max-w-[480px] mx-auto z-50"><button onclick="renderHome()" class="flex flex-col items-center ${a==='home'?'text-[#FF9933]':''}"><span class="text-[18px]">🏠</span><span class="text-[9px]">Home</span></button><button onclick="renderHelp()" class="flex flex-col items-center opacity-70"><span class="text-[18px]">🆘</span><span class="text-[9px]">Helpline</span></button><button onclick="renderCreate()" class="w-14 h-14 -mt-7 rounded-full bg-gradient-to-r from-[#FF9933] to-[#138808] flex items-center justify-center font-black text-black text-xl border-4 border-[#0F172A]">+</button><button onclick="renderSubscription()" class="flex flex-col items-center opacity-70"><span class="text-[18px]">💎</span><span class="text-[9px]">Pro</span></button><button onclick="renderSettings()" class="flex flex-col items-center opacity-70"><span class="text-[18px]">⚙️</span><span class="text-[9px]">Settings</span></button></div>`;}
function filterCat(cat){document.getElementById('videoGrid').innerHTML=videos.filter(v=>v.category===cat).map(v=>`<div onclick="renderEditor(${v.id})" class="aspect-[9/16] rounded-[16px] bg-white/5 border overflow-hidden relative"><video src="${v.footage}" class="w-full h-full object-cover" muted></video><div class="absolute bottom-0 w-full p-2 bg-gradient-to-t from-black to-transparent"><p class="text-[11px] font-bold">${v.title}</p></div></div>`).join('') || `<p class="col-span-2 text-xs text-center p-4 opacity-60">${cat} me koi video nahi</p>`;}
renderHome();
</script>
</body>
</html>
